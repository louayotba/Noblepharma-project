<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Noble Pharma: connected care for patients, physicians, caregivers, pharmacists and health authorities.">
  <title>Noble Pharma</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f2744;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .phone {
      width: 390px;
      max-width: 100%;
      min-height: 820px;
      background: #ffffff;
      border-radius: 40px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.45);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 44px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 600;
      color: #000;
    }

    .status-icons {
      display: flex;
      gap: 5px;
      align-items: center;
      font-size: 13px;
    }

    .header {
      padding: 6px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #00c853, #00a86b);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 3px 8px rgba(0,168,107,0.35);
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      color: #1a2b4a;
    }

    .lang-btn {
      background: #f0f4f8;
      border: none;
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 13px;
      color: #1a2b4a;
      font-weight: 500;
      cursor: pointer;
    }

    .title-section {
      text-align: center;
      padding: 24px 24px 18px;
    }

    .title-section h1 {
      font-size: 23px;
      font-weight: 700;
      color: #1a2b4a;
      line-height: 1.3;
      margin-bottom: 7px;
    }

    .title-section p {
      font-size: 14px;
      color: #6b7a90;
      line-height: 1.4;
    }

    .roles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      padding: 0 16px 24px;
      flex: 1;
    }

    .role-card {
      border-radius: 22px;
      padding: 16px 13px 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      border: none;
      text-align: left;
      position: relative;
      min-height: 158px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .role-card:active {
      transform: scale(0.96);
    }

    .role-card .icon-wrap {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      position: relative;
    }

    .role-card h3 {
      font-size: 15px;
      font-weight: 700;
      color: #1a2b4a;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .role-card p {
      font-size: 12px;
      color: #5a6a80;
      line-height: 1.35;
      flex: 1;
      padding-right: 8px;
    }

    .role-card .arrow {
      position: absolute;
      bottom: 13px;
      right: 13px;
      font-size: 17px;
      font-weight: 600;
      opacity: 0.85;
    }

    /* ===== Color cards matching generated image ===== */
    .card-patient {
      background: linear-gradient(160deg, #eaf2ff 0%, #dce9ff 100%);
    }
    .card-patient .icon-wrap {
      background: linear-gradient(145deg, #bfdbfe, #93c5fd);
      box-shadow: 0 6px 14px rgba(59,130,246,0.35), inset 0 1px 0 rgba(255,255,255,0.6);
    }
    .card-patient .arrow { color: #3b82f6; }

    .card-physician {
      background: linear-gradient(160deg, #e6f9ef 0%, #d1f5e0 100%);
    }
    .card-physician .icon-wrap {
      background: linear-gradient(145deg, #86efac, #4ade80);
      box-shadow: 0 6px 14px rgba(16,185,129,0.35), inset 0 1px 0 rgba(255,255,255,0.55);
    }
    .card-physician .arrow { color: #10b981; }

    .card-pharmacist {
      background: linear-gradient(160deg, #f5eaff 0%, #ebdbff 100%);
    }
    .card-pharmacist .icon-wrap {
      background: linear-gradient(145deg, #d8b4fe, #c084fc);
      box-shadow: 0 6px 14px rgba(139,92,246,0.35), inset 0 1px 0 rgba(255,255,255,0.55);
    }
    .card-pharmacist .arrow { color: #8b5cf6; }

    .card-caregiver {
      background: linear-gradient(160deg, #fff6eb 0%, #ffecd6 100%);
    }
    .card-caregiver .icon-wrap {
      background: linear-gradient(145deg, #fdba74, #fb923c);
      box-shadow: 0 6px 14px rgba(245,158,11,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    }
    .card-caregiver .arrow { color: #f59e0b; }

    .card-network {
      background: linear-gradient(160deg, #e0f8fb 0%, #cbf3f8 100%);
    }
    .card-network .icon-wrap {
      background: linear-gradient(145deg, #67e8f9, #22d3ee);
      box-shadow: 0 6px 14px rgba(6,182,212,0.35), inset 0 1px 0 rgba(255,255,255,0.55);
    }
    .card-network .arrow { color: #06b6d4; }

    .card-authorities {
      background: linear-gradient(160deg, #fce8f3 0%, #fbd0e8 100%);
    }
    .card-authorities .icon-wrap {
      background: linear-gradient(145deg, #f9a8d4, #f472b6);
      box-shadow: 0 6px 14px rgba(236,72,153,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    }
    .card-authorities .arrow { color: #ec4899; }

    /* 3D Icon styles */
    .icon-3d {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.18));
    }

    .home-indicator {
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .home-indicator::after {
      content: "";
      width: 110px;
      height: 4px;
      background: #1a2b4a;
      border-radius: 4px;
      opacity: 0.2;
    }

    @media (max-width: 420px) {
      .phone {
        border-radius: 0;
        min-height: 100vh;
        box-shadow: none;
      }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <span>●●●</span>
        <span>📶</span>
        <span>🔋</span>
      </div>
    </div>

    <div class="header">
      <div class="logo">
        <div class="logo-icon">+</div>
        <span class="logo-text">Noble Pharma</span>
      </div>
      <button class="lang-btn">العربية</button>
    </div>

    <div class="title-section">
      <h1>How will you use<br>Noble Pharma?</h1>
      <p>Your experience is built around your role.</p>
    </div>

    <div class="roles-grid">

      <!-- Patient - Blue Heart 3D -->
      <button class="role-card card-patient" onclick="selectRole('patient')">
        <div class="icon-wrap">
          <svg class="icon-3d" viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#60a5fa"/>
                <stop offset="100%" stop-color="#2563eb"/>
              </linearGradient>
              <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e40af" flood-opacity="0.35"/>
              </filter>
            </defs>
            <path filter="url(#heartShadow)" d="M32 56s-24-14.5-24-30c0-9 7-15 15-15 5 0 9 2.5 11.5 6.5C36.5 13.5 40.5 11 45.5 11c8 0 15 6 15 15 0 15.5-24 30-24 30z" fill="url(#heartGrad)"/>
            <path d="M32 52s-20-12-20-26c0-7.5 5.8-12.5 12.5-12.5 4.2 0 7.5 2 9.5 5.5 2-3.5 5.3-5.5 9.5-5.5C50.2 13.5 56 18.5 56 26c0 14-20 26-20 26z" fill="#93c5fd" opacity="0.35"/>
          </svg>
        </div>
        <h3>Patient</h3>
        <p>Your record, treatment and visits.</p>
        <span class="arrow">→</span>
      </button>

      <!-- Physician - Green Medical Kit 3D -->
      <button class="role-card card-physician" onclick="selectRole('physician')">
        <div class="icon-wrap">
          <svg class="icon-3d" viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="kitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4ade80"/>
                <stop offset="100%" stop-color="#16a34a"/>
              </linearGradient>
              <filter id="kitShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#15803d" flood-opacity="0.35"/>
              </filter>
            </defs>
            <rect filter="url(#kitShadow)" x="10" y="18" width="44" height="34" rx="6" fill="url(#kitGrad)"/>
            <rect x="10" y="18" width="44" height="10" rx="6" fill="#86efac"/>
            <rect x="26" y="28" width="12" height="16" rx="2" fill="white"/>
            <rect x="22" y="33" width="20" height="6" rx="2" fill="white"/>
            <circle cx="32" cy="14" r="5" fill="#22c55e"/>
          </svg>
        </div>
        <h3>Physician</h3>
        <p>Patients, requests and approvals.</p>
        <span class="arrow">→</span>
      </button>

      <!-- Pharmacist - Purple Bottle + Pill 3D -->
      <button class="role-card card-pharmacist" onclick="selectRole('pharmacist')">
        <div class="icon-wrap">
          <svg class="icon-3d" viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#c084fc"/>
                <stop offset="100%" stop-color="#7c3aed"/>
              </linearGradient>
              <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#e9d5ff"/>
                <stop offset="50%" stop-color="#e9d5ff"/>
                <stop offset="50%" stop-color="#a78bfa"/>
                <stop offset="100%" stop-color="#a78bfa"/>
              </linearGradient>
              <filter id="pharmShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6d28d9" flood-opacity="0.35"/>
              </filter>
            </defs>
            <!-- Bottle -->
            <rect filter="url(#pharmShadow)" x="14" y="16" width="24" height="36" rx="5" fill="url(#bottleGrad)"/>
            <rect x="18" y="10" width="16" height="8" rx="2" fill="#a78bfa"/>
            <rect x="20" y="22" width="12" height="3" rx="1" fill="white" opacity="0.5"/>
            <path d="M22 28h8v14h-8z" fill="white" opacity="0.25"/>
            <!-- Pill -->
            <g transform="translate(34,34) rotate(25)">
              <rect x="0" y="0" width="22" height="10" rx="5" fill="url(#pillGrad)"/>
              <line x1="11" y1="1" x2="11" y2="9" stroke="white" stroke-width="1.5" opacity="0.6"/>
            </g>
          </svg>
        </div>
        <h3>Pharmacist · LIORA</h3>
        <p>LIORA dispensers, prescriptions and refills.</p>
        <span class="arrow">→</span>
      </button>

      <!-- Caregiver - Orange Hands + Heart 3D -->
      <button class="role-card card-caregiver" onclick="selectRole('caregiver')">
        <div class="icon-wrap">
          <svg class="icon-3d" viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fdba74"/>
                <stop offset="100%" stop-color="#ea580c"/>
              </linearGradient>
              <linearGradient id="heartOrange" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fecaca"/>
                <stop offset="100%" stop-color="#f87171"/>
              </linearGradient>
              <filter id="careShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#c2410c" flood-opacity="0.35"/>
              </filter>
            </defs>
            <!-- Left hand -->
            <path filter="url(#careShadow)" d="M12 38c0-6 4-10 9-10 2 0 4 1 5.5 2.5V28c0-3 2-5 5-5s5 2 5 5v4c1.5-1.5 3.5-2.5 5.5-2.5 5 0 9 4 9 10v8H12v-8z" fill="url(#handGrad)"/>
            <!-- Heart on top -->
            <path d="M32 24s-8-5-8-10.5C24 10 27 8 30 8c1.8 0 3.2 1 4 2.2C34.8 9 36.2 8 38 8c3 0 6 2 6 5.5C44 19 36 24 32 24z" fill="url(#heartOrange)"/>
          </svg>
        </div>
        <h3>Caregiver</h3>
        <p>Your hosts, daily tasks and alerts.</p>
        <span class="arrow">→</span>
      </button>

      <!-- Medical Network - Teal Network 3D -->
      <button class="role-card card-network" onclick="selectRole('network')">
        <div class="icon-wrap">
          <svg class="icon-3d" viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#67e8f9"/>
                <stop offset="100%" stop-color="#0891b2"/>
              </linearGradient>
              <filter id="netShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0e7490" flood-opacity="0.35"/>
              </filter>
            </defs>
            <!-- Connections -->
            <line x1="32" y1="18" x2="16" y2="42" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="32" y1="18" x2="48" y2="42" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="16" y1="42" x2="48" y2="42" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
            <!-- Nodes -->
            <circle filter="url(#netShadow)" cx="32" cy="16" r="9" fill="url(#netGrad)"/>
            <circle filter="url(#netShadow)" cx="14" cy="44" r="9" fill="url(#netGrad)"/>
            <circle filter="url(#netShadow)" cx="50" cy="44" r="9" fill="url(#netGrad)"/>
            <!-- Inner highlights -->
            <circle cx="29" cy="13" r="3" fill="white" opacity="0.45"/>
            <circle cx="11" cy="41" r="3" fill="white" opacity="0.45"/>
            <circle cx="47" cy="41" r="3" fill="white" opacity="0.45"/>
          </svg>
        </div>
        <h3>Medical Network</h3>
        <p>Hospitals, labs, imaging and more. No sign-in needed.</p>
        <span class="arrow">→</span>
      </button>

      <!-- Authorities - Pink Building 3D -->
      <button class="role-card card-authorities" onclick="selectRole('authorities')">
        <div class="icon-wrap">
          <svg class="icon-3d" viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="buildGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f9a8d4"/>
                <stop offset="100%" stop-color="#db2777"/>
              </linearGradient>
              <filter id="buildShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#9d174d" flood-opacity="0.35"/>
              </filter>
            </defs>
            <!-- Building base -->
            <path filter="url(#buildShadow)" d="M10 52h44v4H10z" fill="#be185d"/>
            <rect x="14" y="24" width="36" height="28" rx="2" fill="url(#buildGrad)"/>
            <!-- Columns -->
            <rect x="18" y="28" width="5" height="20" rx="1" fill="white" opacity="0.7"/>
            <rect x="29.5" y="28" width="5" height="20" rx="1" fill="white" opacity="0.7"/>
            <rect x="41" y="28" width="5" height="20" rx="1" fill="white" opacity="0.7"/>
            <!-- Roof / pediment -->
            <path d="M12 24l20-12 20 12H12z" fill="#f472b6"/>
            <path d="M16 24l16-9 16 9H16z" fill="#f9a8d4"/>
            <!-- Flag -->
            <line x1="32" y1="12" x2="32" y2="6" stroke="#be185d" stroke-width="2"/>
            <path d="M32 6h10l-2 4 2 4H32V6z" fill="#f43f5e"/>
          </svg>
        </div>
        <h3>Authorities</h3>
        <p>Population health, surveillance and alerts.</p>
        <span class="arrow">→</span>
      </button>

    </div>

    <div class="home-indicator"></div>
  </div>

  <script>
    function selectRole(role) {
      // No programming logic changed - visual feedback only
      console.log('Selected role:', role);
      const card = event.currentTarget;
      card.style.transform = 'scale(0.95)';
      setTimeout(() => { card.style.transform = ''; }, 160);
    }
  </script>
</body>
</html>
